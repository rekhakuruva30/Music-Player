<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="app">

    <!-- ============ PLAYER ============ -->
    <section class="player">

      <header class="player__top">
        <span class="player__source">Now playing</span>
        <button class="icon-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4V8h-2.2l-2.3 3.1 2.3 3.1H17V11l4 4-4 4v-3h-3.2l-2.7-3.6L8.4 15H3v-2h4.4l2.7-3.6L12.8 6H17V3zM3 9V7h4.1l1.5 2H3z"/></svg>
        </button>
      </header>

      <!-- Cover image. The .is-playing class makes it rotate slowly. -->
      <div class="cover" id="cover">
        <img id="coverImg" src="assets/images/cover1.jpg" alt="Album cover" />
        <div class="cover__ring"></div>
      </div>

      <!-- Song details -->
      <div class="track">
        <h1 class="track__title" id="title">Loading…</h1>
        <p class="track__artist" id="artist">—</p>
      </div>

      <!-- Progress bar (custom, so it can be styled and dragged) -->
      <div class="progress" id="progress" role="slider"
           aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="progress__track">
          <div class="progress__filled" id="progressFilled"></div>
          <div class="progress__knob" id="progressKnob"></div>
        </div>
      </div>

      <div class="times">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <!-- Transport controls -->
      <div class="controls">
        <button class="icon-btn" id="repeatBtn" title="Repeat off" aria-label="Repeat" aria-pressed="false">
          <svg id="repeatIcon" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
        </button>

        <button class="icon-btn icon-btn--lg" id="prevBtn" title="Previous" aria-label="Previous song">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9-6v12z"/></svg>
        </button>

        <button class="play-btn" id="playBtn" title="Play" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg>
        </button>

        <button class="icon-btn icon-btn--lg" id="nextBtn" title="Next" aria-label="Next song">
          <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 6l9 6-9 6z"/></svg>
        </button>

        <button class="icon-btn" id="muteBtn" title="Mute" aria-label="Mute">
          <svg id="volIcon" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4zm11.5 3a3.5 3.5 0 00-2-3.2v6.4a3.5 3.5 0 002-3.2z"/></svg>
        </button>
      </div>

      <!-- Volume -->
      <div class="volume">
        <svg class="volume__icon" viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4z"/></svg>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" aria-label="Volume" />
      </div>
    </section>

    <!-- ============ PLAYLIST ============ -->
    <section class="playlist">
      <header class="playlist__head">
        <h2>Playlist</h2>
        <span class="playlist__count" id="songCount">0 songs</span>
      </header>
      <ul class="playlist__list" id="playlist"><!-- filled by script.js --></ul>
    </section>

  </main>

  <!-- Small message shown if an audio file is missing -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
